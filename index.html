<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Yakuza 4 - Dragones de Dojima</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="styles.css?v=iconos-20261012-2">
</head>
<body>
  <video id="bg" muted loop playsinline autoplay preload="metadata">
    <source src="assets/install_video.mp4" type="video/mp4">
  </video>

  <audio id="bgm" loop preload="auto">
    <source src="assets/music.wav" type="audio/wav">
  </audio>

  <canvas id="uiCanvas"></canvas>
  <div id="cardsLayer" aria-hidden="true">
    <img id="cardAkiyama" class="characterCard card-right" src="assets/akiyama_card.png" alt="Shun Akiyama">
    <img id="cardSaejima" class="characterCard card-left" src="assets/saejima_card.png" alt="Taiga Saejima">
    <img id="cardTanimura" class="characterCard card-right" src="assets/tanimura_card.png" alt="Masayoshi Tanimura">
    <img id="cardKiryu" class="characterCard card-left" src="assets/kiryu_card.png" alt="Kazuma Kiryu">
  </div>
  <div id="menuDimmer" aria-hidden="true"></div>

  <button id="menuToggle" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="menuPanel">☰</button>

  <aside id="menuPanel" aria-hidden="true" aria-label="Menú">
    <div class="menuSimpleHeader">
      <span>Menú</span>
      <span id="menuProgressValue">--%</span>
    </div>

    <div class="menuTopRow">
      <button class="menuItem" id="musicToggle" type="button" aria-pressed="false">
        <span id="musicToggleText">Silenciar música</span>
      </button>

      <button class="iconButton" id="fullscreenToggle" type="button" aria-label="Pantalla completa" title="Pantalla completa">
        <img id="fullscreenIcon" src="assets/icons/fullscreen.svg" alt="" aria-hidden="true">
      </button>
    </div>

    <label class="menuVolumeSimple" for="musicVolume">
      <span>Volumen</span>
      <input id="musicVolume" type="range" min="0" max="100" step="1" value="50" aria-label="Volumen de la música">
    </label>

    <div class="menuDivider"></div>

    <div class="socialBlock" aria-label="Redes sociales">
      <a class="socialLink" href="https://x.com/Dragones_Dojima" target="_blank" rel="noopener noreferrer" aria-label="Twitter / X" title="Twitter / X">
        <img src="assets/icons/twitter.svg" alt="" aria-hidden="true">
      </a>
      <a class="socialLink" href="https://www.youtube.com/@DragonesDojima" target="_blank" rel="noopener noreferrer" aria-label="YouTube" title="YouTube">
        <img src="assets/icons/youtube.svg" alt="" aria-hidden="true">
      </a>
      <a class="socialLink" href="https://discord.com/invite/dragones-de-dojima-1084322035397841046" target="_blank" rel="noopener noreferrer" aria-label="Discord" title="Discord">
        <img src="assets/icons/discord.svg?v=white-1" alt="" aria-hidden="true">
      </a>
    </div>

    <a class="donationButton" href="https://ko-fi.com/dragonesdedojima" target="_blank" rel="noopener noreferrer">Donaciones</a>
  </aside>

  <div id="introFade" aria-hidden="true"></div>

  <script>
    window.INSTALL_BAR_CONFIG = {
      autoDemo: false,
      fixedProgress: 55.12,
      startDelayMs: 620,
      introMs: 380,
      completeMs: 3300,
      outroMs: 380,
      progressLerp: 0.22,
      progressUrl: "./progress.json",
      progressField: "pct_global"
    };
  </script>
  <script src="install_bar_anim.js"></script>
  <script src="app.js?v=menu-20261012-2"></script>
</body>
</html>
